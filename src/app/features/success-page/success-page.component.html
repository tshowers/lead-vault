<main class="lvs">
  <section class="lvs-card">
    <span class="lv-tag" data-tint="green">Lead unlocked</span>
    <h1>Access granted</h1>
    <ng-container *ngIf="!errorMessage">
      <p class="lvs-lead">Your Lead Vault purchase is complete.</p>
      <p class="lvs-copy">We are verifying your access and preparing the full contact record. Once confirmed, the record will open automatically.</p>
      <p class="lvs-status">{{ statusMessage }}</p>
    </ng-container>
    <p class="lv-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    <div class="lvs-actions" *ngIf="errorMessage"><a class="lv-btn lv-btn--primary" routerLink="/">Return to search</a></div>
  </section>
</main>
