<main class="lvs">
  <section class="lvs-card">
    <span class="lv-tag" data-tint="green">Subscription activated</span>
    <h1>Unlimited access</h1>
    <ng-container *ngIf="!errorMessage">
      <p class="lvs-lead">Your Lead Vault Unlimited subscription is active.</p>
      <p class="lvs-copy">You now have unlimited access to all Lead Vault contacts and can include them directly in campaigns.</p>
      <p class="lvs-status">{{ statusMessage }}</p>
    </ng-container>
    <p class="lv-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    <div class="lvs-actions"><a class="lv-btn lv-btn--primary" routerLink="/">{{ errorMessage ? 'Return to Lead Vault' : 'Start searching' }}</a></div>
  </section>
</main>
