<header class="ah">
  <a class="ah-brand" routerLink="/">
    @if (isLanding()) {
      <!-- Landing page: the 16Ahead dial around Lead Vault's black-and-white icon. Inner pages keep the color logo. -->
      <span class="ah-logo ah-dial" aria-hidden="true">
        <svg viewBox="0 0 64 64"><line x1="32.0" y1="9.0" x2="32.0" y2="2.5"/><line x1="40.8" y1="10.8" x2="43.3" y2="4.7"/><line x1="48.3" y1="15.7" x2="52.9" y2="11.1"/><line x1="53.2" y1="23.2" x2="59.3" y2="20.7"/><line x1="55.0" y1="32.0" x2="61.5" y2="32.0"/><line x1="53.2" y1="40.8" x2="59.3" y2="43.3"/><line x1="48.3" y1="48.3" x2="52.9" y2="52.9"/><line x1="40.8" y1="53.2" x2="43.3" y2="59.3"/><line x1="32.0" y1="55.0" x2="32.0" y2="61.5"/><line x1="23.2" y1="53.2" x2="20.7" y2="59.3"/><line x1="15.7" y1="48.3" x2="11.1" y2="52.9" class="ah-dial__accent"/><line x1="10.8" y1="40.8" x2="4.7" y2="43.3"/><line x1="9.0" y1="32.0" x2="2.5" y2="32.0"/><line x1="10.8" y1="23.2" x2="4.7" y2="20.7"/><line x1="15.7" y1="15.7" x2="11.1" y2="11.1"/><line x1="23.2" y1="10.8" x2="20.7" y2="4.7"/></svg>
        <span class="ah-dial__glyph"></span>
      </span>
    } @else {
      <img class="ah-logo brand-mark--light" src="assets/brand/products/svg/light/10-lead-vault.svg" alt="" width="36" height="36" /><img class="ah-logo brand-mark--dark" src="assets/brand/products/svg/dark/10-lead-vault.svg" alt="" width="36" height="36" />
    }
    <span class="ah-name">Lead Vault</span>
  </a>
  <div class="ah-actions">
    <app-account-chip />
    <button type="button" class="ah-pill ah-theme" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <span>Light</span>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span>Dark</span>
      }
    </button>
    <app-platform-menu [isLoggedIn]="(isLoggedIn$ | async) ?? false" [userName]="(userName$ | async) ?? ''" [userEmail]="(userEmail$ | async) ?? ''" (signIn)="signIn()" (signOut)="signOut()" />
  </div>
</header>
